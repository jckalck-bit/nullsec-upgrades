name: Publish Nullsec upgrades 1.2.1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Restore verified release assets
        run: |
          echo '' | base64 -d > nullsec-upgrades-1.2.1.zip
          echo 'ewogICJzY2hlbWFWZXJzaW9uIjogMSwKICAiaWQiOiAibnVsbHNlYy11cGdyYWRlcyIsCiAgInZlcnNpb24iOiAiMS4yLjEiLAogICJhc3NldCI6ICJudWxsc2VjLXVwZ3JhZGVzLTEuMi4xLnppcCIKfQo=' | base64 -d > nullsec-upgrades-1.2.1.update.json
          echo '1535de5aed1c66032b23453ab2bd8d86e665c355bd454d627f0b2d98400b6d78  nullsec-upgrades-1.2.1.zip' | sha256sum -c
          unzip -t nullsec-upgrades-1.2.1.zip
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.2.1 nullsec-upgrades-1.2.1.zip nullsec-upgrades-1.2.1.update.json --target "$GITHUB_SHA" --title 'Nullsec upgrades 1.2.1' --notes 'Stable release with GitHub update support, diagnostics and expanded configuration documentation.' --latest
